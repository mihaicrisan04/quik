name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross-compile linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/quik dist/
          cp -r shell docs LICENSE README.md dist/
          tar -czf quik-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quik-${{ matrix.target }}
          path: quik-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: compute sha256
        id: sums
        run: |
          cd artifacts
          for f in *.tar.gz; do
            sha=$(shasum -a 256 "$f" | cut -d' ' -f1)
            echo "$sha  $f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
